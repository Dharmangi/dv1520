name: Build and Release Android APK

# Trigger: run every time a commit is pushed to main.
on:
  push:
    branches:
      - main

# Only one release build should run at a time; cancel superseded runs
# so an older push can't overwrite a release created by a newer one.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write # required to create/update GitHub Releases and upload assets

jobs:
  build-and-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    # The Flutter app lives under app/, not the repo root.
    defaults:
      run:
        working-directory: app

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout source
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Read the app version from pubspec.yaml (e.g. "1.0.0+1" -> "v1.0.0")
      #    This becomes the release tag, per project requirement — NOT the
      #    GitHub run number.
      # ------------------------------------------------------------------
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:\s*//')
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$FULL_VERSION" | cut -d'+' -f2)
          TAG="v${VERSION_NAME}"
          echo "Detected pubspec version: $FULL_VERSION"
          echo "Release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 3. Set up Flutter using the exact stable version this project
      #    is developed against (Flutter 3.44.4 / Dart SDK ^3.12.2).
      # ------------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      # ------------------------------------------------------------------
      # 4. Cache Gradle (wrapper + dependencies) to speed up Android builds.
      #    Keyed on the wrapper properties and Gradle/Kotlin build files so
      #    the cache invalidates automatically when the build config changes.
      # ------------------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ------------------------------------------------------------------
      # 5. Set up JDK 17, required by this project's Android Gradle config
      #    (compileOptions / kotlin jvmTarget = JVM_17).
      # ------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ------------------------------------------------------------------
      # 6. Fetch Flutter/Dart dependencies.
      # ------------------------------------------------------------------
      - name: Install Flutter dependencies
        run: flutter pub get

      # ------------------------------------------------------------------
      # 7. Fail fast if Android release signing secrets are not configured.
      #    Without this, Gradle would silently sign with the debug key
      #    (see android/app/build.gradle.kts) and produce an unpublishable APK.
      #    Required repository secrets:
      #      ANDROID_KEYSTORE_BASE64  - base64-encoded .jks keystore file
      #      ANDROID_KEYSTORE_PASSWORD
      #      ANDROID_KEY_ALIAS
      #      ANDROID_KEY_PASSWORD
      # ------------------------------------------------------------------
      - name: Verify signing secrets are configured
        run: |
          missing=()
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Android release signing is not configured. Missing repository secrets: ${missing[*]}"
            echo "::error::See README.md 'Android release signing' section for setup instructions."
            exit 1
          fi
          echo "All required signing secrets are present."

      # ------------------------------------------------------------------
      # 8. Recreate the keystore file and key.properties from secrets.
      #    android/app/build.gradle.kts reads android/key.properties to
      #    apply the release signingConfig; this file is git-ignored.
      # ------------------------------------------------------------------
      - name: Configure Android signing
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/app/android/app/release.jks"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"

          cat > "$GITHUB_WORKSPACE/app/android/key.properties" <<EOF
          storeFile=app/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # ------------------------------------------------------------------
      # 9. Build the release APK, stamping it with the version from pubspec.yaml.
      # ------------------------------------------------------------------
      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      # ------------------------------------------------------------------
      # 10. Remove the keystore from the runner's filesystem now that the
      #     build is done, so it isn't picked up by any later step/cache.
      # ------------------------------------------------------------------
      - name: Clean up signing materials
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/app/android/app/release.jks"
          rm -f "$GITHUB_WORKSPACE/app/android/key.properties"

      # ------------------------------------------------------------------
      # 11. Create the GitHub Release (or update it if the tag already
      #     exists) and upload app-release.apk as a release asset.
      # ------------------------------------------------------------------
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
          # softprops/action-gh-release updates the existing release for this
          # tag (replacing assets) instead of failing if it already exists.
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
